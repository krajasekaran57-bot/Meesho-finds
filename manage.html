<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Meesho Finds | Admin</title>
<style>
:root{--ink:#25231f;--muted:#77736c;--paper:#faf8f4;--line:#eae5dc;--accent:#a65e43}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif;padding:18px;max-width:640px;margin:auto}
h1{font:normal 28px Georgia,serif;margin:6px 0 16px}h1 span{color:var(--accent)}
.card{background:#fff;border:1px solid var(--line);padding:16px;margin-bottom:16px}
label{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;border:1px solid var(--line);padding:12px;font-size:16px;font-family:inherit;border-radius:2px;background:#fff;color:var(--ink)}
textarea{min-height:70px}button{font:inherit;cursor:pointer;border:0;padding:13px 18px;font-size:12px;letter-spacing:1px;margin-top:14px;margin-right:8px}
.save{background:var(--accent);color:#fff}.plain{background:#eee9e2;color:var(--ink)}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item img{width:48px;height:48px;object-fit:cover;background:#eee}.item .n{flex:1;font-size:14px}.item small{display:block;color:var(--muted);margin-top:3px}
.mini{margin:0;padding:8px 10px;font-size:11px;background:#fff;border:1px solid var(--line)}.del{color:#a33}
#msg{font-size:13px;margin-top:10px;min-height:18px}.err{color:#a33}.ok{color:#2d7a3e}
</style></head><body>
<h1>meesho <span>admin.</span> <small style="font-size:12px;color:#77736c">v2</small></h1>
<div id="login" class="card">
 <label for="em">Email</label><input id="em" type="email" autocomplete="username">
 <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
 <button class="save" id="loginBtn">LOG IN</button><div id="lmsg" class="err"></div>
</div>
<div id="app" style="display:none">
 <div class="card"><b id="formTitle">Add product</b>
  <label for="name">Name</label><input id="name">
  <label for="price">Price (₹)</label><input id="price" inputmode="numeric">
  <label for="category">Category</label><select id="category"><option>Gadgets</option><option>Home</option><option>Accessories</option></select>
  <label for="link">Product link</label><input id="link" type="url">
  <label for="image">Image link (optional)</label><input id="image" type="url">
  <label for="description">Description</label><textarea id="description"></textarea>
  <button class="save" id="saveBtn">SAVE PRODUCT</button><button class="plain" id="cancelBtn" style="display:none">CANCEL</button>
  <div id="msg"></div>
 </div>
 <div class="card"><b>Your products</b><div id="list"></div></div>
 <button class="plain" id="logoutBtn">LOG OUT</button>
</div>
<script>
const URL_='https://yrmuomydtzwrsshindnk.supabase.co',KEY='sb_publishable_rCPC-FhUdlLx96eQCQAvKQ_r0BjRRLT';
const $=id=>document.getElementById(id);let token=null,editId=null,items=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(t,ok){$('msg').textContent=t;$('msg').className=ok?'ok':'err';}
const H=()=>({apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'});
async function login(){
 $('lmsg').textContent='';
 const r=await fetch(URL_+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value.trim(),password:$('pw').value})});
 const d=await r.json();
 if(!r.ok){$('lmsg').textContent='Login failed. Check email and password.';return;}
 token=d.access_token;try{sessionStorage.setItem('mf_t',token)}catch(e){}
 show();
}
function show(){$('login').style.display='none';$('app').style.display='block';load();}
async function load(){
 const r=await fetch(URL_+'/rest/v1/products?select=*&order=created_at.desc',{headers:H()});
 if(r.status===401){logout();return;}
 items=r.ok?await r.json():[];
 $('list').innerHTML=items.map((p,i)=>`<div class="item">${p.image?`<img src="${esc(p.image)}" alt="">`:'<img alt="">'}<div class="n">${esc(p.name)}<small>₹${esc(p.price)} · ${esc(p.category)}</small></div><button class="mini" data-e="${i}">EDIT</button><button class="mini del" data-d="${i}">DELETE</button></div>`).join('')||'<p style="color:#77736c;font-size:13px">No products yet.</p>';
}
function clearForm(){editId=null;['name','price','link','image','description'].forEach(k=>$(k).value='');$('formTitle').textContent='Add product';$('cancelBtn').style.display='none';}
async function save(){
 const row={name:$('name').value.trim(),price:$('price').value.trim(),category:$('category').value,link:$('link').value.trim(),description:$('description').value.trim(),image:$('image').value.trim()};
 if(!row.name||!row.price||!row.link){say('Name, price and link are required.');return;}
 let r;
 if(editId!==null){r=await fetch(URL_+'/rest/v1/products?id=eq.'+encodeURIComponent(editId),{method:'PATCH',headers:H(),body:JSON.stringify(row)});}
 else{r=await fetch(URL_+'/rest/v1/products',{method:'POST',headers:H(),body:JSON.stringify(row)});
  if(!r.ok){const t=await r.clone().text();if(/\bid\b/.test(t)){r=await fetch(URL_+'/rest/v1/products',{method:'POST',headers:H(),body:JSON.stringify({...row,id:crypto.randomUUID()})});}}}
 if(r.ok){say('Saved!',true);clearForm();load();}
 else if(r.status===401){logout();}
 else{let t='';try{t=await r.text()}catch(e){}say('Could not save ('+r.status+'): '+t.slice(0,300));}
}
async function del(i){
 if(!confirm('Delete "'+items[i].name+'"?'))return;
 const r=await fetch(URL_+'/rest/v1/products?id=eq.'+encodeURIComponent(items[i].id),{method:'DELETE',headers:H()});
 if(r.ok)load();else say('Could not delete.');
}
function logout(){token=null;try{sessionStorage.removeItem('mf_t')}catch(e){}$('app').style.display='none';$('login').style.display='block';}
$('loginBtn').onclick=login;$('saveBtn').onclick=save;$('cancelBtn').onclick=clearForm;$('logoutBtn').onclick=logout;
$('list').onclick=e=>{const b=e.target;if(b.dataset.d!==undefined)del(+b.dataset.d);
 if(b.dataset.e!==undefined){const p=items[+b.dataset.e];editId=p.id;['name','price','link','image','description'].forEach(k=>$(k).value=p[k]||'');$('category').value=p.category;$('formTitle').textContent='Edit product';$('cancelBtn').style.display='inline-block';scrollTo(0,0);}};
try{const t=sessionStorage.getItem('mf_t');if(t){token=t;show();}}catch(e){}
</script></body></html>
